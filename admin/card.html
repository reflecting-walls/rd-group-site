<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Editor · RD Group Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/logo/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<style>
:root { --bg: #FAFAF8; --surface: #fff; --stone: #EEECE7; --line: #E1DED7; --ink: #16181A; --ink-soft: #55595E; --brass: #A88553; --brass-text: #7A5C31; --danger: #A23B2A; --ok: #2F6B45;
  --f-d: var(--f-display, "Archivo", Arial, sans-serif); --f-b: var(--f-body, "Hanken Grotesk", Arial, sans-serif); color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--f-b); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brass-text); }
.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: rgba(250,250,248,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top img { height: 28px; }
.top h1 { margin: 0; font: 400 1rem/1 var(--f-d); font-stretch: 125%; letter-spacing: .04em; }
.top .crumbs { color: var(--ink-soft); font-size: .85rem; }
.top .crumbs a { color: inherit; text-decoration: none; }
.top .sp { flex: 1; }
.status { font-size: .85rem; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.status[data-s="dirty"]::before { background: var(--brass); }
.status[data-s="saved"]::before { background: var(--ok); }
.status[data-s="error"]::before { background: var(--danger); }

.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 14px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: .88rem; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink-soft); }
.btn-primary { background: var(--ink); color: #FAFAF8; border-color: var(--ink); }
.btn-primary:hover { background: #2a2d30; }
.btn-sm { min-height: 30px; padding: 0 10px; font-size: .8rem; }
.btn-icon { width: 30px; min-height: 30px; padding: 0; justify-content: center; }
.btn-danger:hover { color: var(--danger); border-color: var(--danger); }

.layout { display: grid; grid-template-columns: 200px minmax(0, 1fr) 420px; gap: 0; min-height: calc(100vh - 63px); }
.nav { position: sticky; top: 63px; align-self: start; padding: 24px 12px; display: grid; gap: 2px; }
.nav a { padding: 8px 12px; border-radius: 3px; text-decoration: none; color: var(--ink-soft); font-size: .9rem; }
.nav a:hover, .nav a.on { background: var(--stone); color: var(--ink); }
.form { padding: 24px 32px 120px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); background: var(--surface); }
.preview { position: sticky; top: 63px; align-self: start; height: calc(100vh - 63px); display: grid; place-items: center; padding: 20px; background: var(--stone); }
.phone { width: 360px; height: min(740px, calc(100vh - 150px)); border-radius: 36px; padding: 10px; background: #0b0c0d; box-shadow: 0 30px 80px rgba(0,0,0,.25); }
.phone iframe { width: 100%; height: 100%; border: 0; border-radius: 28px; background: #0F1113; }
.preview-tools { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
@media (max-width: 1180px) { .layout { grid-template-columns: minmax(0,1fr) 400px; } .nav { display: none; } }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .preview { position: static; height: auto; } .form { border: 0; padding: 20px 16px 100px; } .top .crumbs { display: none; } }

section.sec { padding: 28px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 70px; }
section.sec:first-child { padding-top: 4px; }
.sec h2 { margin: 0 0 4px; font: 400 1.25rem/1.2 var(--f-d); font-stretch: 118%; }
.sec .hint { margin: 0 0 18px; color: var(--ink-soft); font-size: .88rem; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.grid .full { grid-column: 1 / -1; }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
label.f { display: grid; gap: 6px; font-size: .78rem; font-weight: 600; letter-spacing: .04em; color: var(--ink-soft); }
label.f small { font-weight: 400; letter-spacing: 0; color: var(--ink-soft); }
input[type=text], input[type=url], input[type=email], input[type=tel], input[type=number], select, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg); font-size: .95rem; color: var(--ink); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brass); box-shadow: 0 0 0 3px rgba(168,133,83,.18); background: #fff; }
textarea { resize: vertical; min-height: 70px; }
.check { display: flex; align-items: center; gap: 10px; font-size: .9rem; }

.media-field { display: flex; gap: 14px; align-items: center; }
.media-thumb { width: 84px; height: 84px; border-radius: 3px; object-fit: cover; background: var(--stone); border: 1px solid var(--line); flex: none; }
.media-thumb.round { border-radius: 50%; }
.media-thumb.wide { width: 150px; }
.media-thumb.logo { object-fit: contain; background: #0F1113; padding: 8px; }
.media-actions { display: grid; gap: 6px; min-width: 0; flex: 1; }
.media-actions input[type=text] { font-size: .8rem; }
.drop { border: 1px dashed var(--line); }
.drop.over { border-color: var(--brass); background: rgba(168,133,83,.06); }

.rep { display: grid; gap: 10px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg); }
.item .grid { gap: 10px 12px; }
.item-tools { display: flex; flex-direction: column; gap: 4px; }
.rep-add { justify-self: start; }

.toast { position: fixed; left: 50%; bottom: 24px; translate: -50% 20px; opacity: 0; padding: 10px 16px; border-radius: 3px; background: var(--ink); color: #FAFAF8; font-size: .88rem; transition: .25s; pointer-events: none; z-index: 50; }
.toast.on { opacity: 1; translate: -50% 0; }
.banner { margin: 0 0 18px; padding: 12px 14px; border-left: 3px solid var(--brass); background: rgba(168,133,83,.08); font-size: .88rem; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner[hidden] { display: none; }
.kbd { font: 500 .75rem/1 ui-monospace, monospace; padding: 2px 5px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg); }
</style>
</head>
<body>
<header class="top">
  <img src="../assets/logo/rd-mark.svg" alt="">
  <h1>Business card</h1>
  <span class="crumbs"><a href="index.html">Admin</a> / Card</span>
  <span class="sp"></span>
  <span class="status" id="status" data-s="idle">Loading…</span>
  <a class="btn" href="../card/" target="_blank" rel="noopener">Open card</a>
  <button class="btn" id="export" hidden title="Download a .zip of all saved changes to upload to the site repository">Download update</button>
  <button class="btn btn-primary" id="save" title="Ctrl/Cmd + S">Save</button>
</header>

<div class="layout">
  <nav class="nav" id="nav"></nav>
  <main class="form" id="form">
    <p class="banner" id="draft-banner" hidden>You have unsaved changes from an earlier session, restored here. <button class="btn btn-sm" id="discard">Discard them</button></p>
  </main>
  <aside class="preview">
    <div>
      <div class="phone"><iframe id="pv" src="../card/?preview=1" title="Card preview"></iframe></div>
      <div class="preview-tools">
        <button class="btn btn-sm" id="test-vcf">Test contact download</button>
        <button class="btn btn-sm" id="qr-png">QR code (PNG)</button>
        <button class="btn btn-sm" id="qr-svg">QR code (SVG)</button>
      </div>
    </div>
  </aside>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="../assets/js/data.js" onerror="void 0"></script>
<script src="../assets/js/admin-auth.js" onerror="void 0"></script>
<script src="../card/vendor/qrcode.js"></script>
<script src="../card/card.js"></script>
<script>
(() => {
"use strict";
const DRAFT_KEY = "rd-card-draft";
const CARD_PAGE = new URL("../card/", location.href).href;
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = () => window.store || window.RDData;
const ICONS = ["link", "grid", "tool", "home", "calendar", "star", "shield", "globe", "mail", "phone", "pin", "download"];
const NETWORKS = ["facebook", "instagram", "houzz", "nextdoor", "youtube", "linkedin", "tiktok", "pinterest", "x"];
const REVIEW_SITES = ["Google", "Yelp", "Angi", "Houzz", "Facebook", "Nextdoor", "BBB", "Thumbtack", "HomeAdvisor", "Porch"];

let data, published, dirty = false;

/* ---------- data layer: swaps to the shared store when it exists ---------- */
async function loadCard() {
  const s = store();
  if (s?.getSetting) { try { const d = await s.getSetting("card"); if (d?.profile) return d; } catch (e) { console.warn(e); } }
  return (await fetch("../card/card.json", { cache: "no-cache" })).json();
}
async function saveCard(obj) {
  const s = store();
  if (s?.setSetting) { await s.setSetting("card", obj); return "saved"; }
  // No backend yet: hand back card.json to replace card/card.json in the site folder.
  const blob = new Blob([JSON.stringify(obj, null, 2) + "\n"], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "card.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return "downloaded";
}
async function uploadImage(file, { max = 1600, folder = "card" } = {}) {
  const blob = await resize(file, max);
  const s = store();
  if (s?.upload) { const f = new File([blob], slugFile(file.name), { type: blob.type }); return (await s.upload(f, folder)).url; }
  return await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
}
const slugFile = (n) => n.toLowerCase().replace(/\.[^.]+$/, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".jpg";
function resize(file, max) {
  if (file.type === "image/svg+xml") return Promise.resolve(file);
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => b ? resolve(b) : reject(new Error("resize failed")), "image/jpeg", .85);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => reject(new Error("Not an image"));
    img.src = URL.createObjectURL(file);
  });
}

/* ---------- path helpers ---------- */
const get = (o, p) => p.split(".").reduce((x, k) => x?.[k], o);
function set(o, p, v) { const ks = p.split("."); let x = o; ks.slice(0, -1).forEach((k) => { x[k] ??= {}; x = x[k]; }); x[ks.at(-1)] = v; }
// Card paths are relative to card/; admin lives in admin/, so resolve for thumbnails.
const fromCard = (src) => !src ? "" : /^(data:|https?:|blob:)/.test(src) ? src : new URL(src, CARD_PAGE).href;

/* ---------- form schema ---------- */
const F = {
  text: (path, label, o = {}) => ({ kind: "input", type: o.type || "text", path, label, ...o }),
  area: (path, label, o = {}) => ({ kind: "area", path, label, ...o }),
  lines: (path, label, o = {}) => ({ kind: "lines", path, label, ...o }),
  media: (path, label, o = {}) => ({ kind: "media", path, label, ...o }),
};
const SECTIONS = [
  { id: "profile", title: "Profile", hint: "Who's on the card. The photo is cropped to a circle; use a bright, head-and-shoulders shot.", fields: [
    F.media("profile.photo", "Profile photo", { shape: "round", max: 800, full: 1 }),
    F.text("profile.firstName", "First name"), F.text("profile.lastName", "Last name"),
    F.text("profile.title", "Title"), F.text("profile.company", "Company"),
    F.text("profile.headline", "Headline", { full: 1, small: "One sentence under the name." }),
    F.area("profile.bio", "About", { full: 1 }),
    F.lines("profile.credentials", "Credentials", { full: 1, small: "One per line, e.g. Licensed & insured" }),
  ]},
  { id: "branding", title: "Cover & logo", hint: "The cover sits behind the photo. A wide finished-project shot works best.", fields: [
    F.media("profile.cover", "Cover image", { shape: "wide", max: 1800, full: 1 }),
    F.media("profile.logo", "Logo (light version for dark backgrounds)", { shape: "logo", max: 800, full: 1 }),
  ]},
  { id: "contact", title: "Contact", hint: "Everything here also goes into the downloadable contact (.vcf).", fields: [
    F.text("contact.mobile", "Mobile", { type: "tel" }), F.text("contact.sms", "Text number", { type: "tel", small: "Usually the same as mobile" }),
    F.text("contact.office", "Office phone", { type: "tel" }), F.text("contact.email", "Email", { type: "email" }),
    F.text("contact.website", "Website", { type: "url", full: 1 }),
    F.text("contact.address.street", "Street (optional)", { full: 1 }),
    F.text("contact.address.city", "City"), F.text("contact.address.region", "State"),
    F.text("contact.address.postal", "ZIP"), F.text("contact.address.country", "Country"),
    F.text("contact.serviceArea", "Service area", { full: 1 }),
    F.text("contact.hours", "Hours", { full: 1 }),
  ]},
  { id: "actions", title: "Buttons & lead form", hint: "Leave the estimate link empty to use the built-in request form on the card.", fields: [
    F.text("actions.estimateLabel", "Estimate button label"),
    F.text("actions.estimateUrl", "Estimate link (optional)", { type: "url", small: "e.g. a booking page" }),
    F.text("actions.formEndpoint", "Form endpoint (optional)", { type: "url", full: 1, small: "Formspree/Basin URL. Without one, the form opens a pre-filled text message to you." }),
  ]},
  { id: "services", title: "Services", hint: "Shown as tags on the card and saved into the contact's notes.", fields: [
    F.lines("services", "Services", { full: 1, small: "One per line" }),
  ]},
  { id: "gallery", title: "Recent work", hint: "A swipeable strip of project photos. Portrait (4:5) crops look best.", repeat: { path: "gallery", add: "Add project", blank: { src: "", title: "", location: "", tags: [], url: "", alt: "" }, fields: [
    F.media("src", "Photo", { max: 1600, full: 1 }),
    F.text("title", "Title"), F.text("location", "Location", { small: "City, IL (helps local SEO)" }),
    F.text("tags", "Tags", { csv: 1, small: "Comma separated: bathroom, shower" }), F.text("url", "Link", { small: "Project page" }),
    F.text("alt", "Alt text", { full: 1, small: "Describe the photo for search engines and screen readers" }),
  ]}},
  { id: "reviews", title: "Review sites", hint: "Each site gets a tile linking to your reviews there. The card shows a combined rating weighted by review count.", repeat: { path: "reviews.sources", add: "Add review site", blank: { name: "", icon: "", rating: 0, count: 0, url: "" }, fields: [
    F.text("name", "Site", { list: "review-sites" }), F.text("url", "Reviews link", { type: "url" }),
    F.text("rating", "Rating (0–5)", { type: "number", step: "0.1", min: 0, max: 5, num: 1 }), F.text("count", "Number of reviews", { type: "number", min: 0, num: 1 }),
  ]}},
  { id: "quotes", title: "Featured reviews", hint: "Paste your best reviews. Link each to where it was posted.", repeat: { path: "reviews.featured", add: "Add review", blank: { text: "", author: "", source: "", url: "", rating: 5 }, fields: [
    F.area("text", "Review", { full: 1 }),
    F.text("author", "Name"), F.text("source", "Site", { list: "review-sites" }),
    F.text("url", "Link to review", { type: "url" }), F.text("rating", "Stars", { type: "number", min: 1, max: 5, num: 1 }),
  ]}},
  { id: "links", title: "Links", hint: "Buttons for pages you want people to visit.", repeat: { path: "links", add: "Add link", blank: { label: "", url: "", icon: "link" }, fields: [
    F.text("label", "Label"), F.text("url", "URL"),
    { kind: "select", path: "icon", label: "Icon", options: ICONS },
  ]}},
  { id: "socials", title: "Social profiles", hint: "Empty links are hidden.", repeat: { path: "socials", add: "Add profile", blank: { network: "instagram", url: "" }, fields: [
    { kind: "select", path: "network", label: "Network", options: NETWORKS }, F.text("url", "Profile URL", { type: "url" }),
  ]}},
  { id: "look", title: "Look", hint: "", fields: [
    { kind: "select", path: "theme.mode", label: "Style", options: ["dark", "light"] },
    F.text("theme.accent", "Accent color", { type: "color" }),
  ]},
  { id: "seo", title: "Search & sharing", hint: "How the card appears on Google and when the link is shared by text or social.", fields: [
    F.text("seo.title", "Page title", { full: 1 }), F.area("seo.description", "Description", { full: 1, small: "About 150 characters" }),
    F.media("seo.image", "Share image (optional, 1200×630)", { shape: "wide", max: 1200, full: 1 }),
    F.text("seo.canonical", "Card URL", { type: "url", full: 1, small: "The card's public address, e.g. https://www.rdgroup.info/card/" }),
    F.text("slug", "File name for downloads"),
    { kind: "check", path: "seo.indexable", label: "Let search engines index this card" },
  ]},
];

/* ---------- rendering ---------- */
function fieldHTML(f, base = "") {
  const path = base + f.path, id = "f-" + path.replace(/\W/g, "-"), cls = f.full ? "f full" : "f";
  const small = f.small ? `<small>${esc(f.small)}</small>` : "";
  const v = get(data, path);
  if (f.kind === "input") {
    const val = f.csv ? (v || []).join(", ") : v ?? "";
    const extra = ["step", "min", "max"].filter((k) => f[k] !== undefined).map((k) => `${k}="${f[k]}"`).join(" ");
    return `<label class="${cls}" for="${id}">${esc(f.label)}<input id="${id}" type="${f.type}" data-path="${path}" ${f.csv ? "data-csv" : ""} ${f.num ? "data-num" : ""} ${f.list ? `list="${f.list}"` : ""} ${extra} value="${esc(val)}">${small}</label>`;
  }
  if (f.kind === "area") return `<label class="${cls}" for="${id}">${esc(f.label)}<textarea id="${id}" data-path="${path}" rows="3">${esc(v)}</textarea>${small}</label>`;
  if (f.kind === "lines") return `<label class="${cls}" for="${id}">${esc(f.label)}<textarea id="${id}" data-path="${path}" data-lines rows="4">${esc((v || []).join("\n"))}</textarea>${small}</label>`;
  if (f.kind === "select") return `<label class="${cls}" for="${id}">${esc(f.label)}<select id="${id}" data-path="${path}">${f.options.map((o) => `<option ${o === v ? "selected" : ""}>${o}</option>`).join("")}</select></label>`;
  if (f.kind === "check") return `<label class="check full"><input type="checkbox" data-path="${path}" data-bool ${v !== false ? "checked" : ""}>${esc(f.label)}</label>`;
  if (f.kind === "media") return `<div class="${cls}"><span style="font-size:.78rem;font-weight:600;letter-spacing:.04em;color:var(--ink-soft)">${esc(f.label)}</span>
    <div class="media-field drop" data-drop="${path}" data-max="${f.max || 1600}" style="padding:10px;border-radius:3px">
      <img class="media-thumb ${f.shape || ""}" src="${esc(fromCard(v))}" alt="" ${v ? "" : 'style="visibility:hidden"'}>
      <div class="media-actions">
        <div style="display:flex;gap:6px;flex-wrap:wrap"><label class="btn btn-sm">Upload…<input type="file" accept="image/*" data-upload="${path}" data-max="${f.max || 1600}" hidden></label>${v ? `<button class="btn btn-sm btn-danger" type="button" data-clear="${path}">Remove</button>` : ""}<span style="font-size:.78rem;color:var(--ink-soft);align-self:center">or drop a file here</span></div>
        <input type="text" data-path="${path}" value="${esc(v && v.startsWith("data:") ? "(uploaded image)" : v)}" placeholder="…or paste an image URL" ${v && v.startsWith("data:") ? "readonly" : ""}>
      </div>
    </div></div>`;
  return "";
}
function sectionHTML(s) {
  let body;
  if (s.repeat) {
    const list = get(data, s.repeat.path) || [];
    body = `<div class="rep">${list.map((_, i) => `
      <div class="item"><div class="grid">${s.repeat.fields.map((f) => fieldHTML(f, `${s.repeat.path}.${i}.`)).join("")}</div>
        <div class="item-tools">
          <button class="btn btn-icon btn-sm" type="button" data-move="${s.repeat.path}" data-i="${i}" data-d="-1" aria-label="Move up" ${i ? "" : "disabled"}>↑</button>
          <button class="btn btn-icon btn-sm" type="button" data-move="${s.repeat.path}" data-i="${i}" data-d="1" aria-label="Move down" ${i < list.length - 1 ? "" : "disabled"}>↓</button>
          <button class="btn btn-icon btn-sm btn-danger" type="button" data-del="${s.repeat.path}" data-i="${i}" aria-label="Delete">✕</button>
        </div></div>`).join("")}
      <button class="btn btn-sm rep-add" type="button" data-add="${s.id}">+ ${esc(s.repeat.add)}</button></div>`;
  } else body = `<div class="grid">${s.fields.map((f) => fieldHTML(f)).join("")}</div>`;
  return `<section class="sec" id="s-${s.id}"><h2>${esc(s.title)}</h2>${s.hint ? `<p class="hint">${esc(s.hint)}</p>` : ""}${body}</section>`;
}
function renderForm() {
  const form = $("#form"), banner = $("#draft-banner");
  const y = scrollY;
  form.innerHTML = ""; form.appendChild(banner);
  form.insertAdjacentHTML("beforeend", SECTIONS.map(sectionHTML).join("") +
    `<datalist id="review-sites">${REVIEW_SITES.map((s) => `<option value="${s}">`).join("")}</datalist>`);
  $("#nav").innerHTML = SECTIONS.map((s) => `<a href="#s-${s.id}">${esc(s.title)}</a>`).join("");
  scrollTo(0, y);
  if (window.io) document.querySelectorAll("section.sec").forEach((s) => io.observe(s));
}

/* ---------- preview ---------- */
const pv = $("#pv");
let pvReady = false, pvTimer;
// Card paths are relative to card/, same as the preview frame, so they resolve correctly there.
const pushPreview = () => { if (pvReady && data) pv.contentWindow.postMessage({ type: "rd-card", card: data }, location.origin); };
addEventListener("message", (e) => { if (e.origin === location.origin && e.data?.type === "rd-card-ready") { pvReady = true; pushPreview(); } });

/* ---------- state ---------- */
function markDirty() {
  dirty = true; status("dirty", "Unsaved changes");
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(data)); } catch {}
  clearTimeout(pvTimer); pvTimer = setTimeout(pushPreview, 120);
}
function status(s, text) { const el = $("#status"); el.dataset.s = s; el.textContent = text; }
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 2600); }

$("#form").addEventListener("input", (e) => {
  const el = e.target, path = el.dataset.path; if (!path || el.readOnly) return;
  let v = el.value;
  if ("lines" in el.dataset) v = v.split("\n").map((s) => s.trim()).filter(Boolean);
  else if ("csv" in el.dataset) v = v.split(",").map((s) => s.trim()).filter(Boolean);
  else if ("num" in el.dataset) v = v === "" ? 0 : +v;
  else if ("bool" in el.dataset) v = el.checked;
  set(data, path, v);
  if (path.endsWith(".name") && path.startsWith("reviews.sources")) set(data, path.replace(/name$/, "icon"), v.toLowerCase());
  const thumb = el.closest(".media-field")?.querySelector(".media-thumb");
  if (thumb) { thumb.src = fromCard(v); thumb.style.visibility = v ? "" : "hidden"; }
  markDirty();
});
$("#form").addEventListener("change", (e) => { if (e.target.type === "checkbox") e.target.dispatchEvent(new Event("input", { bubbles: true })); });

async function handleFile(file, path, max) {
  if (!file) return;
  status("dirty", "Uploading…");
  try { set(data, path, await uploadImage(file, { max: +max })); renderForm(); markDirty(); toast("Image added"); }
  catch (err) { status("error", "Upload failed"); toast(err.message || "Upload failed"); }
}
$("#form").addEventListener("change", (e) => { const up = e.target.dataset.upload; if (up) handleFile(e.target.files[0], up, e.target.dataset.max); });
$("#form").addEventListener("dragover", (e) => { const z = e.target.closest("[data-drop]"); if (z) { e.preventDefault(); z.classList.add("over"); } });
$("#form").addEventListener("dragleave", (e) => e.target.closest("[data-drop]")?.classList.remove("over"));
$("#form").addEventListener("drop", (e) => { const z = e.target.closest("[data-drop]"); if (!z) return; e.preventDefault(); z.classList.remove("over"); handleFile(e.dataTransfer.files[0], z.dataset.drop, z.dataset.max); });

$("#form").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.clear) { set(data, b.dataset.clear, ""); renderForm(); markDirty(); }
  if (b.dataset.add) {
    const s = SECTIONS.find((x) => x.id === b.dataset.add); const list = get(data, s.repeat.path) || [];
    list.push(structuredClone(s.repeat.blank)); set(data, s.repeat.path, list); renderForm(); markDirty();
    setTimeout(() => $(`#s-${s.id} .item:last-of-type input`)?.focus(), 0);
  }
  if (b.dataset.del) { const list = get(data, b.dataset.del); if (confirm("Remove this item?")) { list.splice(+b.dataset.i, 1); renderForm(); markDirty(); } }
  if (b.dataset.move) { const list = get(data, b.dataset.move), i = +b.dataset.i, j = i + +b.dataset.d; [list[i], list[j]] = [list[j], list[i]]; renderForm(); markDirty(); }
});

$("#save").addEventListener("click", async () => {
  status("dirty", "Saving…");
  try {
    const how = await saveCard(structuredClone(data));
    published = structuredClone(data); dirty = false;
    localStorage.removeItem(DRAFT_KEY);
    if (how === "saved") { status("saved", "Saved as draft"); toast("Saved. Use Download update to put it on the live site."); refreshExport(); }
    else { status("saved", "card.json downloaded"); toast("Replace card/card.json with the downloaded file to publish"); }
  } catch (err) { console.error(err); status("error", "Save failed"); toast("Save failed: " + (err.message || err)); }
});
$("#discard").addEventListener("click", () => { data = structuredClone(published); localStorage.removeItem(DRAFT_KEY); $("#draft-banner").hidden = true; dirty = false; renderForm(); pushPreview(); status("saved", "Saved as draft"); });

// Pending changes across the whole admin (from the shared draft store), exported as one .zip.
function refreshExport() {
  const s = store(), b = $("#export");
  if (!s?.downloadUpdate) return;
  const n = s.status?.().files?.length || 0;
  b.hidden = false; b.disabled = !n;
  b.textContent = n ? `Download update (${n} file${n > 1 ? "s" : ""})` : "Download update";
}
$("#export").addEventListener("click", async () => {
  if (dirty && !confirm("You have unsaved card edits. They won't be in the update unless you Save first. Continue anyway?")) return;
  try { await store().downloadUpdate(); toast("Update downloaded. Upload its contents to the site repository to go live."); }
  catch (err) { console.error(err); toast("Couldn't build the update: " + (err.message || err)); }
});

const cardLink = () => data.seo?.canonical || CARD_PAGE;
$("#test-vcf").addEventListener("click", () => RDCard.downloadVCard(data, { cardUrl: cardLink(), base: CARD_PAGE }));
const dl = (blob, name) => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
$("#qr-png").addEventListener("click", async () => dl(await RDCard.svgToPng(RDCard.qrSvg(cardLink())), (data.slug || "card") + "-qr.png"));
$("#qr-svg").addEventListener("click", () => dl(new Blob([RDCard.qrSvg(cardLink())], { type: "image/svg+xml" }), (data.slug || "card") + "-qr.svg"));
addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); $("#save").click(); } });
addEventListener("beforeunload", (e) => { if (dirty) e.preventDefault(); });

// Highlight the section in view
var io = window.io = new IntersectionObserver((ents) => ents.forEach((en) => { if (en.isIntersecting) $("#nav").querySelectorAll("a").forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + en.target.id)); }), { rootMargin: "-40% 0px -55% 0px" });

(async () => {
  if (typeof window.requireAdmin === "function") await window.requireAdmin();
  try { published = await loadCard(); }
  catch (err) { status("error", "Couldn't load card data"); console.error(err); return; }
  data = structuredClone(published);
  try { const draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); if (draft?.profile && JSON.stringify(draft) !== JSON.stringify(published)) { data = draft; dirty = true; $("#draft-banner").hidden = false; } } catch {}
  renderForm(); pushPreview();
  status(dirty ? "dirty" : "saved", dirty ? "Unsaved changes" : (store()?.setSetting ? "No unsaved changes" : "Local mode · saves download card.json"));
  refreshExport(); store()?.onChange?.(refreshExport);
})();
})();
</script>
</body>
</html>
